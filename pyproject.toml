[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pay-per-call-agent-economy"
version = "0.1.0"
description = "DI-06: Autonomous Pay-per-call Agent Economy with x402 v2 payment lifecycle on Base Sepolia"
authors = [{ name = "Hackathon Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "SQLAlchemy>=2.0.30",
    "python-dotenv>=1.0.1",
    "web3>=6.19.0",
    "eth-account>=0.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
